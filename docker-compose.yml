services:
  api:
    build:
      context: .
      dockerfile: src/FieldOps.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FIELDOPS_WEB_ORIGIN: http://localhost:4173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4173:80"

